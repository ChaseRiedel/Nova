<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova V3</title><style> *{box-sizing:border-box}body{margin:0;background:#070c18;color:#e6f6ff;font:16px system-ui}header,nav{display:flex;gap:8px;padding:12px;background:#101a30;flex-wrap:wrap}button,input,a{font:inherit}button,a.tile{background:#142442;color:#dff7ff;border:1px solid #268aff;border-radius:10px;padding:10px;cursor:pointer;text-decoration:none}input{flex:1;min-width:140px;background:#070c18;color:white;border:1px solid #268aff;border-radius:10px;padding:10px}main{text-align:center;padding:40px 16px}h1{font-size:64px;color:#4adfff;text-shadow:0 0 24px #168aff;margin:20px}section{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:24px auto;max-width:650px}iframe{width:100%;height:65vh;border:1px solid #268aff;background:white}small,p{color:#a7bdd9}.active{background:#1756a0} </style></head><body><header id="tabs"></header><nav><button onclick="home()">⌂</button><input id="address" placeholder="Search DuckDuckGo or enter a URL"><button onclick="go()">Go</button><button id="toggle" onclick="toggle()">Lab: OFF</button></nav><main id="page"></main><script>const sites={YouTube:'https://www.youtube.com/',Roblox:'https://www.roblox.com/',TikTok:'https://www.tiktok.com/',Instagram:'https://www.instagram.com/',X:'https://x.com/',Snapchat:'https://www.snapchat.com/',ChatGPT:'https://chatgpt.com/',Scratch:'https://scratch.mit.edu/'};let tabs=[{url:''}],current=0,enabled=false;const page=document.querySelector('#page'),address=document.querySelector('#address');function draw(){const bar=document.querySelector('#tabs');bar.replaceChildren();tabs.forEach((t,i)=>{let b=document.createElement('button');b.textContent=t.url?'Tab '+(i+1):'Nova';b.className=i===current?'active':'';b.onclick=()=>{current=i;render()};bar.append(b)});let b=document.createElement('button');b.textContent='+';b.onclick=()=>{tabs.push({url:''});current=tabs.length-1;render()};bar.append(b)}function render(){draw();page.replaceChildren();let u=tabs[current].url;address.value=u;if(!u){page.innerHTML='<h1>NOVA</h1><small>made by Chase</small><section id="links"></section><p>Official websites open in your browser. The lab opens inside Nova.</p>';let links=document.querySelector('#links');Object.entries(sites).forEach(([name,url])=>{let a=document.createElement('a');a.className='tile';a.textContent=name;a.href=url;a.target='_blank';a.rel='noopener noreferrer';links.append(a)});let b=document.createElement('button');b.textContent='Open networking lab';b.onclick=()=>{if(!enabled){alert('Turn the lab on first.');return}tabs[current].url='lab';render()};links.append(b)}else if(u==='lab'){if(!enabled){page.textContent='Lab is disabled.';return}let f=document.createElement('iframe');f.title='Nova practice page';f.src='lab.html';page.append(f)}else{let a=document.createElement('a');a.className='tile';a.href=u;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open official website';page.append(a);let p=document.createElement('p');p.textContent=u;page.append(p)}}function home(){tabs[current].url='';render()}function toggle(){enabled=!enabled;document.querySelector('#toggle').textContent='Lab: '+(enabled?'ON':'OFF');render()}function go(){let s=address.value.trim();if(!s)return;let u;try{u=new URL(s.includes('://')?s:'https://'+s);if(!['https:','http:'].includes(u.protocol)||!u.hostname.includes('.')||/\s/.test(s))throw 0}catch{u=new URL('https://duckduckgo.com/?q='+encodeURIComponent(s))}tabs[current].url=u.href;render()}address.addEventListener('keydown',e=>{if(e.key==='Enter')go()});render();</script></body></html>
