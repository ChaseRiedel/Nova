<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova</title><style>
:root{font-family:system-ui,Arial;background:#050b1b;color:#e7f6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 90%,#0849a5 0%,#061c45 35%,#050b1b 75%);min-height:100vh}.top{display:flex;align-items:center;gap:8px;padding:12px;background:#081126;border-bottom:1px solid #1b5ba0}.tabs{display:flex;gap:6px;flex:1;overflow:auto}.tab{background:#10264b;border:1px solid #2356a1;border-radius:9px;color:#c9eaff;padding:10px 14px;white-space:nowrap;cursor:pointer}.tab.active{background:#1454a3;border-color:#48baff}.add,.go,button{cursor:pointer}.add{border:1px solid #2675cb;border-radius:9px;background:#102d57;color:#5edbff;padding:9px 14px;font-size:19px}.bar{display:flex;gap:8px;padding:10px;background:#07152d;border-bottom:1px solid #1760a8}.bar input{flex:1;min-width:0;border:1px solid #2878bf;border-radius:20px;background:#0c2345;color:white;padding:12px;font-size:16px}.bar button,.tile{background:#0b3264;color:white;border:1px solid #2464a8;border-radius:12px;padding:12px}.go{background:#0874d5!important}.home{text-align:center;padding:10vh 20px 50px}.logo{font-size:clamp(66px,14vw,150px);font-weight:750;letter-spacing:-7px;color:#12a6ff;text-shadow:0 0 35px #007fff55}.by{color:#56e4fa;font-size:14px;letter-spacing:2px}.sub{color:#a6c7e8}.tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin:36px auto;max-width:650px}.tile{min-width:140px;font-size:16px}.tile span{display:block;font-size:30px;margin-bottom:8px}.view{display:none;width:100%;height:calc(100vh - 116px);border:0;background:white}.notice{display:none;padding:14px;text-align:center;color:#cce6ff;background:#09244b}.notice a{color:#63d6ff}button:focus-visible,input:focus-visible{outline:2px solid cyan}
</style></head><body><div class="top"><strong style="color:#36cfff">✦ NOVA</strong><div class="tabs" id="tabs"></div><button class="add" id="add" aria-label="New tab">+</button></div><form class="bar" id="search"><button type="button" id="back">⌂</button><input id="address" placeholder="Search DuckDuckGo or enter a URL" autocomplete="off"><button class="go" type="submit">Go</button></form><main id="home" class="home"><div class="logo">Nova</div><div class="by">made by Chase Riedel</div><p class="sub">Your space to search, explore and play</p><div class="tiles"><button class="tile" data-url="https://www.roblox.com/"><span>🎮</span>Roblox</button><button class="tile" data-url="https://chatgpt.com/"><span>✦</span>ChatGPT</button><button class="tile" data-url="https://duckduckgo.com/"><span>🔎</span>DuckDuckGo</button><button class="tile" data-url="https://scratch.mit.edu/"><span>🐱</span>Scratch</button></div><p class="sub">Some websites block embedded viewing. Use “Open website” if a page doesn't load.</p></main><div id="notice" class="notice">If this site is blank or refuses to connect, it may not allow embedded viewing. <a id="external" target="_blank" rel="noopener noreferrer">Open website</a></div><iframe id="view" class="view" title="Nova website viewer" referrerpolicy="no-referrer"></iframe><script>
const tabs=document.getElementById('tabs'),address=document.getElementById('address'),frame=document.getElementById('view'),home=document.getElementById('home'),notice=document.getElementById('notice'),external=document.getElementById('external');let items=[{title:'Home',url:''}],active=0;function render(){tabs.replaceChildren();items.forEach((t,i)=>{let b=document.createElement('button');b.className='tab'+(i===active?' active':'');b.textContent=t.title+' ×';b.onclick=()=>{if(i===active&&items.length>1){items.splice(i,1);active=Math.max(0,i-1)}else active=i;show()};tabs.append(b)})}function show(){let t=items[active];render();address.value=t.url;home.style.display=t.url?'none':'block';frame.style.display=t.url?'block':'none';notice.style.display=t.url?'block':'none';if(t.url){frame.src=t.url;external.href=t.url}else frame.removeAttribute('src')}function nav(raw){let value=raw.trim();if(!value)return;let url;if(/^https?:\/\//i.test(value))url=value;else if(/^[\w-]+(\.[\w-]+)+([/:?].*)?$/i.test(value))url='https://'+value;else url='https://duckduckgo.com/?q='+encodeURIComponent(value);if(!/^https?:\/\//i.test(url))return;items[active]={title:new URL(url).hostname.replace(/^www\./,''),url};show()}document.getElementById('search').onsubmit=e=>{e.preventDefault();nav(address.value)};document.getElementById('add').onclick=()=>{items.push({title:'Home',url:''});active=items.length-1;show()};document.getElementById('back').onclick=()=>{items[active]={title:'Home',url:''};show()};document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>nav(b.dataset.url));show();
</script></body></html>
